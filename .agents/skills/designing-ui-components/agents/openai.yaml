interface:
  display_name: "Designing UI components"
  short_description: "Audit, pick a pictured direction, install free registry components, verify a11y"
# BEGIN generated by npm run agents:sync
# servers: shadcn, magicui, motion, chrome-devtools
dependencies:
  tools:
    - type: "mcp"
      value: "shadcn"
      description: "Search, view and preview installs from the free registries in components.json"
      transport: "stdio"
      command: "npx -y shadcn@latest mcp"
    - type: "mcp"
      value: "magicui"
      description: "Browse the Magic UI free component catalog"
      transport: "stdio"
      command: "npx -y @magicuidesign/mcp@latest"
    - type: "mcp"
      value: "motion"
      description: "Search Motion docs and examples before animating (free server only)"
      transport: "streamable_http"
      url: "https://mcp.motion.dev"
    - type: "mcp"
      value: "chrome-devtools"
      description: "Screenshots of mockups and pages, Lighthouse accessibility audits, console checks"
      transport: "stdio"
      command: "bash -c exec node \"$(git rev-parse --show-toplevel)/scripts/agents/browser-mcp.mjs\" \"$@\" browser-mcp"
# END generated
