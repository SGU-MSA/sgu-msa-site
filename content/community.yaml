# Starter text for the Community updates page heading and empty state (PR5b).
# The live site reads it from the dashboard (Pages → Community); the updates
# themselves are Announcements and Community news.

# The sections below the page top, in the order visitors see them; `shown: false`
# hides one and keeps its text (Pages, review 3 B; src/lib/content/page-layouts.ts).
sections:
  - { id: updates, shown: true }

eyebrow: "Stay connected"
title: "Community updates"
description: "News, notices, and moments from Muslim life at SGU."
empty_title: "There are no current updates."
empty_hint: "New community news and notices will appear here."
